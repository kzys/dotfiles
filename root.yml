- name: laptop
  hosts: localhost
  # Reload even if a later task fails, since the next run won't notify again.
  force_handlers: true
  handlers:
    - name: reload systemd
      systemd_service:
        daemon_reload: true
    - name: reload udev
      command: udevadm control --reload
    - name: reload apparmor
      command: apparmor_parser -r -T -W /etc/apparmor.d/bwrap
  tasks:
    # files/root mirrors the paths it installs to. Git keeps only the
    # executable bit, so set the rest here rather than from the checkout.
    - file:
        path: "/{{ item.path }}"
        state: directory
      with_community.general.filetree: root/
      when: item.state == 'directory'
      loop_control:
        label: "{{ item.path }}"
      tags: always
    - copy:
        src: "{{ item.src }}"
        dest: "/{{ item.path }}"
        mode: "{{ '0755' if (item.mode | int(base=8)) // 64 % 2 else '0644' }}"
      with_community.general.filetree: root/
      when: item.state == 'file'
      loop_control:
        label: "{{ item.path }}"
      notify:
        - reload systemd
        - reload udev
        - reload apparmor
      tags: always
    # bin/pino runs pi under bubblewrap, which needs the profile in files/root to
    # create a user namespace.
    - block:
        - apt:
            name: bubblewrap
            state: present
          notify: reload apparmor
      tags: pi-sandbox
    # powertop auto-tune on boot
    - block:
        - apt:
            name: powertop
            state: present
        - systemd_service:
            name: powertop.service
            enabled: true
            state: started
            daemon_reload: true
      tags: powertop
    # Firefox: snap build is heavier on CPU/battery than Mozilla's APT package
    - block:
        - command: snap remove --purge firefox
          register: snap_remove_firefox
          failed_when: snap_remove_firefox.rc != 0 and 'not installed' not in (snap_remove_firefox.stderr | default(''))
          changed_when: snap_remove_firefox.rc == 0
        - file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'
        # Pinned to the key with fingerprint
        # 35BAA0B33E9EB396F59CA838C0BA5CE6DC6315A3, which Mozilla publishes
        # in its install instructions. A different key fails here instead of
        # being trusted by apt.
        - get_url:
            url: https://packages.mozilla.org/apt/repo-signing-key.gpg
            dest: /etc/apt/keyrings/packages.mozilla.org.asc
            checksum: sha256:3ecc63922b7795eb23fdc449ff9396f9114cb3cf186d6f5b53ad4cc3ebfbb11f
        - copy:
            content: |
              deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main
            dest: /etc/apt/sources.list.d/mozilla.list
        - copy:
            content: |
              Package: *
              Pin: origin packages.mozilla.org
              Pin-Priority: 1000
            dest: /etc/apt/preferences.d/mozilla
        # unattended-upgrades ignores the pin and would "upgrade" to Ubuntu's
        # transitional 1:1snap1 package (the epoch outranks real versions),
        # which reinstalls the snap. Blacklist firefox from auto-upgrades;
        # it still updates from Mozilla's repo via manual apt upgrade.
        - copy:
            content: |
              Unattended-Upgrade::Package-Blacklist {
                  "firefox";
              };
            dest: /etc/apt/apt.conf.d/51unattended-upgrades-firefox
        - apt:
            update_cache: true
        - apt:
            name: firefox
            state: latest
            allow_downgrade: true
      tags: firefox
