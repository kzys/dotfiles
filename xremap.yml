# This is for emulating Mac-like shortcuts.

keypress_delay_ms: 5

modmap:
  - name: Global
    remap:
      CapsLock: Ctrl_L
  - name: Alt as Cmd on browsers and Slack
    application:
      only: [firefox, Google-chrome, Microsoft-edge, Slack]
    remap:
      LeftAlt: Ctrl_R

keymap:
  - name: Emacs-like shortcuts for moving a cursor
    remap:
      Ctrl_L-f: right
      Ctrl_L-b: left
      Ctrl_L-n: down
      Ctrl_L-p: up
      Ctrl_L-a: home
      Ctrl_L-e: end
      Ctrl_L-g: Esc
    application:
      not: [Emacs, Gnome-terminal, gnome-terminal-server]
  - name: Cmd-c, Cmd-v on Terminal
    application:
      only: [gnome-terminal-server, Gnome-terminal]
    remap:
      Alt-n: C-Shift-n
      Alt-c: C-Shift-c
      Alt-v: C-Shift-v
