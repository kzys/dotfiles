keypress_delay_ms: 5

modmap:
  - name: Global
    remap:
      CapsLock: Ctrl_R

keymap:
  - name: Emacs-like shortcuts for moving a cursor
    remap:
      Ctrl_R-f: right
      Ctrl_R-b: left
      Ctrl_R-n: down
      Ctrl_R-p: up
      Ctrl_R-a: home
      Ctrl_R-e: end
      Ctrl_R-g: Esc
      Ctrl_R-h: Backspace
    application:
      not: [Emacs, Gnome-terminal, gnome-terminal-server, Code]
  - name: Cmd-c, Cmd-v on Terminal
    application:
      only: [gnome-terminal-server, Gnome-terminal]
    remap:
      Ctrl_L-n: C-Shift-n
      Ctrl_L-c: C-Shift-c
      Ctrl_L-v: C-Shift-v
