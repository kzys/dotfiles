- name: laptop
  hosts:
    - localhost
  vars:
    # drop sudo's default -S/-n flags so PAM (fingerprint, then password) can
    # prompt on the real terminal instead of requiring --ask-become-pass
    ansible_become_flags: -H
  tasks:
    - copy:
        src: xremap.service
        dest: ~/.config/systemd/user/
    - command: systemctl --user daemon-reload
    - command: systemctl --user enable xremap.service
    - command: systemctl --user start xremap.service
    # xremap + udev
    - block:
        - copy:
            src: bin/systemctl-as-gnome-user
            dest: /usr/local/bin
        - copy:
            src: keyboard.rules
            dest: /etc/udev/rules.d/
      become: true
    # Atlassian keep-alive
    - copy:
        src: atlassian-keepalive.service
        dest: ~/.config/systemd/user/
      tags: atlassian
    - copy:
        src: atlassian-keepalive.timer
        dest: ~/.config/systemd/user/
      tags: atlassian
    - command: systemctl --user daemon-reload
      tags: atlassian
    - command: systemctl --user enable atlassian-keepalive.timer
      tags: atlassian
    - command: systemctl --user start atlassian-keepalive.timer
      tags: atlassian
    # powertop auto-tune on boot
    - block:
        - apt:
            name: powertop
            state: present
        - copy:
            src: powertop.service
            dest: /etc/systemd/system/
        - command: systemctl daemon-reload
        - command: systemctl enable --now powertop.service
      become: true
      tags: powertop
    # Firefox: snap build is heavier on CPU/battery than Mozilla's APT package
    - block:
        - command: snap remove --purge firefox
          register: snap_remove_firefox
          failed_when: snap_remove_firefox.rc != 0 and 'not installed' not in (snap_remove_firefox.stderr | default(''))
          changed_when: snap_remove_firefox.rc == 0
        - file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'
        - get_url:
            url: https://packages.mozilla.org/apt/repo-signing-key.gpg
            dest: /etc/apt/keyrings/packages.mozilla.org.asc
        - copy:
            content: |
              deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main
            dest: /etc/apt/sources.list.d/mozilla.list
        - copy:
            content: |
              Package: *
              Pin: origin packages.mozilla.org
              Pin-Priority: 1000
            dest: /etc/apt/preferences.d/mozilla
        - apt:
            update_cache: true
        - apt:
            name: firefox
            state: latest
            allow_downgrade: true
      become: true
      tags: firefox
