onboarding = false

[theme]
name = "one-dark"
auto_switch = true

[ui]
# Create tabs right away with generated names, like tmux.
prompt_new_tab_name = false

tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = '"$HOME/ws/dotfiles/bin/herdr-agent-tally"', interval_seconds = 1, timeout_seconds = 2 },
]
tab_bar_right_separator = " · "

[ui.sidebar.agents]
# $-tokens are reported by bin/claude-statusline and bin/codex-hook.
rows = [
  ["state_text", { token = "workspace", bold = true }, "machine", "tab", "$ctx"],
  [{ token = "$bg", bold = true }, "terminal_title_stripped", "$branch"],
  [{ token = "$prompt", dim = true }],
]

[ui.sidebar.spaces]
# $title is reported by bin/herdr-front-matter.
rows = [
  ["state_icon", "workspace"],
  [{ token = "$title", dim = true }],
  ["branch", "git_status"],
]

[keys]
# The default prefix, C-b, is backward-char.
prefix = "ctrl+z"

# Emacs-style movement in navigate mode.
navigate_workspace_up = "ctrl+p"
navigate_workspace_down = "ctrl+n"
navigate_pane_left = "ctrl+b"
navigate_pane_right = "ctrl+f"

# prefix+c opens new tabs where the agent is working instead.
new_tab = ""

# prefix+w opens the project picker below instead of either.
workspace_picker = ""
new_workspace = ""

switch_workspace = "prefix+shift+1..9"

[[keys.command]]
key = "prefix+w"
type = "popup"
description = "ask agent"
command = '"$HOME/ws/dotfiles/bin/herdr-project-picker"'
width = "80%"
height = "60%"

[[keys.command]]
key = "prefix+c"
type = "shell"
description = "new tab where the agent is working"
# $cwd is reported by the agent integration. Use it while an agent runs
# in the pane, and only if the directory still exists.
command = '''
dir=$("$HERDR_BIN_PATH" pane get "$HERDR_ACTIVE_PANE_ID" |
    jq -r '.result.pane | select(.agent == "claude" or .agent == "codex") | .tokens.cwd // empty')
[ -d "$dir" ] || dir=
"$HERDR_BIN_PATH" tab create --workspace "$HERDR_ACTIVE_WORKSPACE_ID" --cwd "${dir:-$HERDR_ACTIVE_PANE_CWD}" --focus
'''
