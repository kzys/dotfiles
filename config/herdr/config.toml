onboarding = false

[theme]
name = "catppuccin"
auto_switch = true

[ui]
# Create tabs right away with generated names, like tmux.
prompt_new_tab_name = false

tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = '"$HOME/ws/dotfiles/bin/herdr-agent-tally"', interval_seconds = 1, timeout_seconds = 2 },
]
tab_bar_right_separator = " · "

[ui.sidebar.agents]
# $-tokens are reported by bin/claude-statusline.
rows = [
  ["state_text", { token = "workspace", bold = true }, "machine", "tab", "$ctx"],
  [{ token = "$bg", fg = "#f38ba8", bold = true }, "terminal_title_stripped", "$branch"],
  [{ token = "$prompt", dim = true }],
]

[keys]
# The default prefix, C-b, is backward-char.
prefix = "ctrl+z"

# Emacs-style movement in navigate mode.
navigate_workspace_up = "ctrl+p"
navigate_workspace_down = "ctrl+n"
navigate_pane_left = "ctrl+b"
navigate_pane_right = "ctrl+f"

# prefix+w opens the project picker below instead of either.
workspace_picker = ""
new_workspace = ""

switch_workspace = "prefix+shift+1..9"

[[keys.command]]
key = "prefix+w"
type = "popup"
description = "ask agent"
command = '"$HOME/ws/dotfiles/bin/herdr-ask"'
width = "80%"
height = "60%"
