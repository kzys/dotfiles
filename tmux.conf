# See Also:
# https://mutelight.org/practical-tmux
# http://d.hatena.ne.jp/naoya/20130108/1357630895

# macOS
if-shell -b '[ "$(uname)" = Darwin ]' {
    set-option -g default-command "reattach-to-user-namespace -l /bin/zsh"
}

# The default prefix key is C-b, but I use that for backward-char.
set-option -g prefix C-z

# Use C-f, C-b, ... in copy-mode
set-window-option -g mode-keys emacs

# Emacs
bind -Tctrl_x 2 split-window
bind -Tctrl_x Any { send C-x; send }
bind -Troot C-x switch-client -Tctrl_x

# Like Screen
bind-key C-a last-window

# Start numbering at 1, because 0 is too far
set -g base-index 1

# Color
set -g status-bg gray
set -g status-fg black
set-window-option -g window-status-current-style fg=white,bg=blue

# Don't have to show anything around the status bar
set -g status-left ''
set -g status-right ''

# Remove the delay
set -s escape-time 0

# Pane Title
setw -g window-status-current-format "#{window_index}:#{pane_title}#{window_flags} "
setw -g window-status-format         "#{window_index}:#{pane_title}#{window_flags} "

# Mouse
set-option -g mouse on

# Make 80x24 work
# https://github.com/tmux/tmux/wiki/FAQ#what-is-the-passthrough-escape-sequence-and-how-do-i-use-it
set-option -g allow-passthrough on
