# See Also:
# https://mutelight.org/practical-tmux
# http://d.hatena.ne.jp/naoya/20130108/1357630895

# Emacs
bind-key C-y paste-buffer

## The default prefix key is C-b, but I use that for backward-char.
set-option -g prefix C-z

## Use C-f, C-b, ... in copy-mode
set-window-option -g mode-keys emacs

## C-x 2, C-x 3 and other shortcuts for split-window
bind -Tctrl_x 2 split-window -v
bind -Tctrl_x 3 split-window -h
bind -Tctrl_x Any { send C-x; send }
bind -Troot C-x switch-client -Tctrl_x

# Like Screen
bind-key C-a last-window

# Start numbering at 1, because 0 is too far
set -g base-index 1

# Color
set -g status-bg lightgray
set -g status-fg black
set-window-option -g window-status-current-style fg=black,bg=gray

# Don't have to show anything around the status bar
set -g status-left ''
set -g status-right ''

# Remove the delay
set -g escape-time 0

# Pane Title
setw -g window-status-current-format "#{window_index}:#{=/15/…:pane_title} #{p-2:window_flags}"
setw -g window-status-format         "#{window_index}:#{=/15/…:pane_title} #{p-2:window_flags}"

# Don't show "hostname @ hostname" before zsh sets the title
set-hook -g after-new-window   'select-pane -T " "'
set-hook -g after-split-window 'select-pane -T " "'

# Mouse
set-option -g mouse on

set -g set-titles on
set -g set-titles-string "#T @ #H"

bind r source-file ~/.tmux.conf \; display "reloaded tmux.conf"

# Claude Code
# https://code.claude.com/docs/en/terminal-config#configure-tmux
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Platform-dependent settings

set -g copy-command 'tmux-copy'

## macOS
if-shell -b '[ "$(uname)" = Darwin ]' {
    set-option -g default-command "reattach-to-user-namespace -l /bin/zsh"
}
