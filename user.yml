- name: laptop
  hosts: localhost
  handlers:
    - name: reload systemd
      systemd_service:
        daemon_reload: true
        scope: user
  tasks:
    # The services find this checkout through $DOTFILES, which install.sh
    # sets in the user manager.
    - command: systemctl --user show-environment
      register: user_env
      changed_when: false
      check_mode: false
    - assert:
        that: user_env.stdout_lines | select('match', 'DOTFILES=.') | list | length > 0
        fail_msg: DOTFILES isn't set; run install.sh first.
    # files/home mirrors the paths it installs to
    - copy:
        src: home/
        dest: ~/
        mode: preserve
      notify: reload systemd
      tags: always
    - meta: flush_handlers
    # The keep-alive service fails without its credentials, which live
    # outside this repository.
    - stat:
        path: ~/.config/atlassian-keepalive.env
      register: atlassian_env
    - systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
        scope: user
      loop:
        - xremap.service
        - atlassian-keepalive.timer
      when: item != 'atlassian-keepalive.timer' or atlassian_env.stat.exists
    - systemd_service:
        name: atlassian-keepalive.timer
        enabled: false
        state: stopped
        scope: user
      when: not atlassian_env.stat.exists
