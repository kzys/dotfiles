[main]
term=foot
font=Ubuntu Mono:size=16
initial-window-size-chars=80x40

[colors]
background=ffffff
# foreground is deliberately identical to regular0 below. foot's dim
# formula (render.c color_dim) only honors a custom dimN override when the
# color being dimmed exactly matches one of regular0-7/bright0-7 - making
# foreground == regular0 guarantees that match fires on purpose, so dim0
# reliably becomes the color for dim/placeholder text (e.g. Claude Code's
# input hint), instead of leaving it to foot's default darken-toward-black.
foreground=202020

# Normal colors (0-7)
regular0=202020
regular1=c0392b
regular2=1e8449
regular3=b7950b
regular4=2266cc
regular5=8e44ad
regular6=17869e
regular7=d0d0d0

# Bright colors (8-15)
bright0=767676
bright1=e74c3c
bright2=27ae60
bright3=d4ac0d
bright4=3498db
bright5=af7ac5
bright6=48c9b0
bright7=ffffff

# dim0 is what actually controls Claude Code's placeholder text (see
# foreground, above). dim1-7 are for anything else that dims an explicit
# color (e.g. `ls`, `git diff --stat`) - readable variants of regular1-7.
dim0=767676
dim1=9a2e22
dim2=186a3a
dim3=927709
dim4=1b51a3
dim5=71368a
dim6=126b7e
dim7=999999

# GNOME's Mutter doesn't do server-side decorations, so ask foot to draw
# its own titlebar/border (client-side) to match other GNOME app windows.
[csd]
preferred=client
size=32
color=ffffffff
border-width=1
border-color=ffc0c0c0
button-color=ff000000
